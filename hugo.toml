baseURL = "https://omermertkaya.github.io/"
theme = "noteworthy"
enableRobotsTXT = true
paginate = 5 # Set the number of posts to show before overflowing to the next page.
summaryLength = 10 # Configure how long the post summary should be on the homepage.

defaultContentLanguage = "tr"
defaultContentLanguageInSubdir = false # Turkish stays at the root (/posts/...), English lives under /en/...

# Add your Google Analytics identifier: UA-XXXXXXXX-X
googleAnalytics = ""

# Add your Disqus shortname here.
disqusShortname = ""


[taxonomies]
  category = "categories"
  tag = "tags"

[author]
    name = "Omer Mert KAYA"

# Set to false to disallow raw HTML in markdown files
[markup.goldmark.renderer]
    unsafe = true

[languages]
    [languages.tr]
        languageCode = "tr-TR"
        languageName = "Türkçe"
        weight = 1
        title = "Ömer Mert Kaya"

        [languages.tr.params]
            math = true
            # Blog description at the top of the homepage. Supports markdown.
            description = "Ömer Mert Kaya'nın Kişisel Sayfası, Identity And Access Management Engineer"

            # Shown under the name in the header, and reused as the schema.org jobTitle.
            jobTitle = "Identity & Access Management Engineer"
            expertiseTags = ["IAM", "IGA", "IDM", "PAM", "Identity Security"]

            # Reused as schema.org Person.knowsAbout on the home and about pages.
            knowsAbout = [
                "Identity and Access Management",
                "Identity Governance and Administration",
                "Identity Management",
                "Privileged Access Management",
                "Authentication",
                "Authorization",
                "Single Sign-On",
                "SAML",
                "OpenID Connect",
                "RBAC",
                "ABAC",
                "Identity Security",
            ]

            showReadMore = false

            # Set enableKofi to true to enable the Ko-fi support button. Add your Ko-fi ID to link to your account.
            enableKofi = false
            kofi = ""

            # Add links to your accounts. Remove the ones you don't want to include.
            # Main
            email = "omermertkaya@hotmail.com.tr"
            linkedin = "https://linkedin.com/in/omermertkaya"

            # Programming
            github = "https://github.com/omermertkaya"

            # Youtube
            youtube = "https://www.youtube.com/@mekod3763"

            # Medium hesabınızın bağlantısını ekleyin.
            medium = "https://medium.com/@omermertkaya"

            # SEO settings
            author = "Omer Mert KAYA"
            keywords = "ömer mert kaya'nın kişisel bloğu, identity and access management, kimlik ve erişim yönetimi, security blog, security engineer"

        [[languages.tr.menu.main]]
            identifier = "Anasayfa"
            name = "Anasayfa"
            url = "/"
            weight = 1

        [[languages.tr.menu.main]]
            identifier = "about"
            name = "Hakkında"
            url = "/about/"
            weight = 2

        [[languages.tr.menu.main]]
            identifier = "ozgecmis"
            name = "Özgeçmiş"
            url = "/ozgecmis/"
            weight = 3

        [[languages.tr.menu.main]]
            identifier = "tags"
            name = "Etiketler"
            url = "/tags/"
            weight = 4

        [[languages.tr.menu.main]]
            identifier = "archives"
            name = "Arşiv"
            url = "/archives/"
            weight = 5

    [languages.en]
        languageCode = "en-US"
        languageName = "English"
        weight = 2
        title = "Ömer Mert Kaya"

        [languages.en.params]
            math = true
            description = "Personal page of Ömer Mert Kaya, Identity and Access Management Engineer"

            jobTitle = "Identity & Access Management Engineer"
            expertiseTags = ["IAM", "IGA", "IDM", "PAM", "Identity Security"]

            knowsAbout = [
                "Identity and Access Management",
                "Identity Governance and Administration",
                "Identity Management",
                "Privileged Access Management",
                "Authentication",
                "Authorization",
                "Single Sign-On",
                "SAML",
                "OpenID Connect",
                "RBAC",
                "ABAC",
                "Identity Security",
            ]

            showReadMore = false

            enableKofi = false
            kofi = ""

            email = "omermertkaya@hotmail.com.tr"
            linkedin = "https://linkedin.com/in/omermertkaya"
            github = "https://github.com/omermertkaya"
            youtube = "https://www.youtube.com/@mekod3763"
            medium = "https://medium.com/@omermertkaya"

            author = "Omer Mert KAYA"
            keywords = "ömer mert kaya personal blog, identity and access management, iam engineer, security blog, security engineer"

        [[languages.en.menu.main]]
